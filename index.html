  const loadedFontFaces = new Set(); // family names already injected, so this never
                                       // re-injects the same @font-face rule twice
  function ensureFontLoaded(familyName){
    if(loadedFontFaces.has(familyName)) return;
    const def = FONT_FACE_DATA[familyName];
    if(!def) return; // an uploaded custom font, or the built-in DM Mono/Alte Haas Grotesk
                      // used for the app's own UI chrome - those aren't in this table and
                      // don't need lazy injection, they're already declared normally.
    const style = document.createElement('style');
    style.textContent = `@font-face{font-family:'${familyName}';src:url("${def.src}") format('${def.format}');font-weight:${def.weight};font-style:${def.style};font-display:swap;}`;
    document.head.appendChild(style);
    loadedFontFaces.add(familyName);
  }

  async function loadTextFont(fontFamily){
    // Wait for the selected bundled face before measuring or drawing. Without this,
    // canvas can render a fallback on the first conversion and only show the real font later.
    ensureFontLoaded(fontFamily);
    try{
      const loaded = await document.fonts.load(`400 ${TEXT_FONT_SIZE}px "${fontFamily}"`);
      return loaded.length > 0;
    } catch(err){
      return false;
    }
  }

  function renderTextToCanvas(text, fontFamily){
    // supports multiple lines (poster-style addresses, event listings, etc.) - each line is
    // measured independently, then stacked with even spacing and centred as a block.
    const size = TEXT_FONT_SIZE;
    const lines = text.split('\n').map(l => l.length ? l : ' ');
    const measure = document.createElement('canvas').getContext('2d');
    measure.font = `400 ${size}px "${fontFamily}"`;
    const lineWidths = lines.map(l => measure.measureText(l).width);
    const maxWidth = Math.max(1, ...lineWidths);
    const lineHeight = size*1.15;
    const topPad = size*0.175;
    const w = Math.ceil(maxWidth) + Math.round(size*0.5);
    const h = Math.round(lineHeight*lines.length + topPad*2);
    const tc = document.createElement('canvas');
    tc.width = w; tc.height = h;
    const tctx = tc.getContext('2d');
    tctx.fillStyle = '#ffffff';
    tctx.fillRect(0,0,w,h);
    tctx.fillStyle = '#000000';
    tctx.font = `400 ${size}px "${fontFamily}"`;
    tctx.textBaseline = 'middle';
    tctx.textAlign = 'left';
    lines.forEach((line, i) => {
      const y = topPad + lineHeight*(i + 0.5);
      tctx.fillText(line, Math.round(size*0.25), y);
    });
    return tc;
  }

  function hasConversionSource(){
    return (sourceIsText && textInput.value.trim()) || lastUploadedImage;
  }

  function getConversionSource(){
    if(sourceIsText && textInput.value.trim()){
      return renderTextToCanvas(textInput.value, fontSelect.value);
    }
    return lastUploadedImage;
  }

  function downsampleProgressive(source, targetW, targetH){
    // A single drawImage() scaling straight from full resolution down to a small handful of
    // grid cells is an extreme ratio (often 50-100x) - browsers don't properly area-average
    // at that ratio even with smoothing on, so thin strokes just vanish between samples
    // instead of contributing to the average. Halving repeatedly until close to the target
    // keeps every step within a ratio browsers actually average correctly.
    let cur = source;
    let w = source.width, h = source.height;
    while(w/2 > targetW && h/2 > targetH){
      const nw = Math.max(1, Math.round(w/2)), nh = Math.max(1, Math.round(h/2));
      const step = document.createElement('canvas');
      step.width = nw; step.height = nh;
      const sctx = step.getContext('2d');
      sctx.imageSmoothingEnabled = true;
      sctx.imageSmoothingQuality = 'high';
      sctx.drawImage(cur, 0, 0, nw, nh);
      cur = step; w = nw; h = nh;
    }
    return cur;
  }

  function unsupportedChars(text, family){
    const covered = FONT_COVERAGE[family];
    if(!covered) return [];   // an uploaded font: no coverage data to check against
    const bad = [];
    for(const ch of new Set(text)){
      if(/[\s\p{Cf}]/u.test(ch)) continue;   // spaces and invisible format characters need no glyph
      if(!covered.includes(ch)) bad.push(ch);
    }
    return bad;
  }

  async function convertImageToBlobs(){
    if(sourceIsText && textInput.value.trim()){
      const loaded = await loadTextFont(fontSelect.value);
      if(!loaded){
        fontUploadStatus.textContent = "That font couldn't be loaded.";
        return;
      }
    }
    const img = getConversionSource();
    if(!img) return;
    const textNoteParts = [];
    if(sourceIsText){
      const bad = unsupportedChars(textInput.value, fontSelect.value);
      if(bad.length){
        const shown = bad.slice(0, 6).join(' ') + (bad.length > 6 ? ' +' + (bad.length - 6) + ' more' : '');
        textNoteParts.push(fontSelect.value + ' has no glyph for ' + shown + '. Those characters are drawn in a stand-in font.');
      }
    }

    const {iMin, iMax, jMin, jMax} = conversionIndexRange();
    const cols = iMax - iMin + 1;
    const rows = jMax - jMin + 1;
    const tmp = document.createElement('canvas');
    tmp.width = cols; tmp.height = rows;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#ffffff';
    tctx.fillRect(0,0,cols,rows);

    const scale = Math.min(cols/img.width, rows/img.height);
    const dw = img.width*scale, dh = img.height*scale;
    const dx = (cols-dw)/2, dy = (rows-dh)/2;
    const pre = downsampleProgressive(img, dw, dh);
    tctx.imageSmoothingEnabled = true;
    tctx.imageSmoothingQuality = 'high';
    tctx.drawImage(pre, dx, dy, dw, dh);

    const data = tctx.getImageData(0,0,cols,rows).data;
    const threshold = +document.getElementById('threshSlider').value;
    const invert = document.getElementById('invertToggle').checked;

    // A conversion that replaces hand-made content is one undoable step. Re-running it while
    // the canvas still holds pure conversion output (retyping, a slider, a different font)
    // replaces it in place, so typing a word is a single step rather than one per keystroke.
    if(!canvasFromConversion) pushHistory();
    nodeList = []; nodeSet.clear();
    for(let jj=0;jj<rows;jj++){
      for(let ii=0;ii<cols;ii++){
        const idx = (jj*cols+ii)*4;
        const lum = 0.299*data[idx] + 0.587*data[idx+1] + 0.114*data[idx+2];
        const on = invert ? lum > threshold : lum < threshold;
        if(on){
          const i = iMin+ii, j = jMin+jj;
          const key = i+'_'+j;
          nodeSet.add(key);
          nodeList.push(makeNode(i, j, null));
        }
      }
    }
    canvasFromConversion = true;
    if(sourceIsText && nodeList.length === 0){
      textNoteParts.push('Nothing to draw at this grid size. Try lowercase, a bolder font or a finer grid.');
    }
    setTextNote(textNoteParts.join(' '));
    render();
  }


  // live preview: once an image is loaded or text is typed, dragging the threshold (or
  // flipping invert, or changing the font) re-runs the conversion immediately so you can see
  // where the cutoff lands before committing to it. Throttled to one update per frame so a
  // fast drag stays smooth.
  let threshPreviewPending = false;
  function scheduleThreshPreview(){
    if(!hasConversionSource()) return;
    if(threshPreviewPending) return;
    threshPreviewPending = true;
    requestAnimationFrame(()=>{
      threshPreviewPending = false;
      convertImageToBlobs();
    });
  }
  document.getElementById('threshSlider').addEventListener('input', scheduleThreshPreview);
  document.getElementById('invertToggle').addEventListener('change', scheduleThreshPreview);

  // ---------- responsive canvas: the internal pixel grid tracks the element's real
  // displayed size, so a taller/wider box reveals more grid at the same spacing
  // instead of the whole drawing being stretched or squashed to fit. ----------
  function applyCanvasSize(){
    const rect = canvas.getBoundingClientRect();
    const newW = Math.max(200, Math.round(rect.width));
    const newH = Math.max(200, Math.round(rect.height));
    const newDPR = Math.max(1, window.devicePixelRatio || 1);
    W = newW;
    H = newH;
    DPR = newDPR;

    // CSS size stays logical, backing-store size gets multiplied by devicePixelRatio.
    // This is the key fix for the jagged edges on Retina/HiDPI displays.
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    off.width = Math.round(W * DPR);
    off.height = Math.round(H * DPR);
    blobCacheKey = null;   // resizing wipes the offscreen buffer, so the cached blob layer is gone

    setHiDPITransform(ctx);
    setHiDPITransform(offCtx);
  }

  let resizePending = false;
  function scheduleResize(){
    if(resizePending) return;
    resizePending = true;
    requestAnimationFrame(()=>{
      resizePending = false;
      applyCanvasSize();
      render();
    });
  }

  if(window.ResizeObserver){
    new ResizeObserver(scheduleResize).observe(canvas);
  } else {
    window.addEventListener('resize', scheduleResize);
  }

  // Read-only snapshot of the drawing for the automated tests (tests/softer-tests.js).
  // read-only geometry of the stickers Remix added, for the tests
  window.softerRemixMode = m => { remixSceneMode = m; };
  window.softerCanvasCentreX = () => { const tl = screenToWorld(0,0), br = screenToWorld(W,H); return (tl.x+br.x)/2; };
  window.softerStickerGeometry = () => {
    const rxs = stickerList.filter(st => st.rx);
    const rad = st => 0.5 * Math.hypot(STICKERS[st.key].w, STICKERS[st.key].h) * st.scale;
    let overlap = false, onInk = false;
    for(let a=0;a<rxs.length;a++){
      for(let b=a+1;b<rxs.length;b++) if(Math.hypot(rxs[a].wx-rxs[b].wx, rxs[a].wy-rxs[b].wy) < rad(rxs[a]) + rad(rxs[b])) overlap = true;
      for(const nd of nodeList) if(Math.hypot(nd.wx-rxs[a].wx, nd.wy-rxs[a].wy) < nd.r + 0.7*rad(rxs[a])) onInk = true;
    }
    const tl = screenToWorld(0,0), br = screenToWorld(W,H);
    const inside = rxs.every(st => st.wx-rad(st) >= tl.x && st.wx+rad(st) <= br.x && st.wy-rad(st) >= tl.y && st.wy+rad(st) <= br.y);
    const overVisitor = rxs.some(st => stickerList.some(o => !o.rx && Math.hypot(o.wx-st.wx, o.wy-st.wy) < rad(o) + rad(st)));
    return { sizes: new Set(rxs.map(st => st.scale)).size, stickerOverlap: overlap, onInk, inside, overVisitor, count: rxs.length };
  };
  window.softerState = () => ({
    nodes: nodeList.length,
    allInView: nodeList.every(n => { const p = worldToScreen(n.wx, n.wy); return p.x >= 0 && p.x <= W && p.y >= 0 && p.y <= H; }),
    noDuplicateCells: new Set(nodeList.map(n => n.i+'_'+n.j)).size === nodeList.length,
    lastRemix,
    cells: nodeList.map(n => n.i+','+n.j).join(';'),
    centre: nodeList.length ? (() => {
      const xs = nodeList.map(n => n.wx), ys = nodeList.map(n => n.wy);
      const c = worldToScreen((Math.min(...xs)+Math.max(...xs))/2, (Math.min(...ys)+Math.max(...ys))/2);
      return {dx: c.x - W/2, dy: c.y - H/2, spacingPx: spacing*zoom};
    })() : null,
    stickers: stickerList.map(s => ({key:s.key, rotation:s.rotation||0, rx:!!s.rx, flip:!!s.flip, x:Math.round(s.wx), y:Math.round(s.wy)})),
  });

  applyCanvasSize();
  syncBlendAvailability();
  render();
})();
</script>
</body>
</html>
